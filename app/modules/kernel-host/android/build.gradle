plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nibikernelhost'
version = '0.1.0'

dependencies {
  // T8 S2：版本必须与 kernel/Cargo.lock 的 rustls-platform-verifier-android 一致；
  // scripts/android-kernel/build.mjs 会核对。仓库声明在 app/android/build.gradle 的 allprojects。
  implementation "org.rustls:rustls-platform-verifier:0.2.0"
}

android {
  namespace "expo.modules.nibikernelhost"

  buildFeatures {
    // D20：:kernel Service 的控制面（INibiKernelService.aidl）。
    aidl true
  }

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // 内核产物目前只有 arm64-v8a（D19）；其它 ABI 不构建 JNI 薄层，JS 侧按不可用降级。
    ndk {
      abiFilters "arm64-v8a"
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.31.4"
    }
  }

  sourceSets {
    main {
      // 由 scripts/android-kernel/build.mjs 从 kernel/ 交叉编译并校验后落盘（不入库）。
      jniLibs.srcDirs += ["$projectDir/prebuilt/jniLibs"]
    }
  }
}
