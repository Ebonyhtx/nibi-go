# Dependabot version updates are limited to the pinned GitHub Actions below.
# npm dependency maintenance is intentionally not automated as version-update
# PRs; alert-driven Dependabot security updates remain active via repository
# settings and are triaged individually.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # 主版本升级会改变 CI 中固定的 action commit SHA，需手动评估后升级。
    ignore:
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pnpm/action-setup"
        update-types: ["version-update:semver-major"]
